server {
	listen 80;
	server_name urlshortener.sam1037.com;
	return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
	server_name urlshortener.sam1037.com;
    root /usr/share/nginx/html;

	ssl_certificate /etc/letsencrypt/live/urlshortener.sam1037.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/urlshortener.sam1037.com/privkey.pem;

    # react
	location = / { try_files /index.html =404; }
	location = /result { try_files /index.html =404; }
	location ~ ^/[^/]+/stat$ { try_files /index.html =404; }

    # api to express
    location /api/ {
        proxy_pass http://server:3000; # URL where your BE server is running
        
        # Pass the original host and IP headers to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

	location / {
		try_files $uri @backend;
	}

	location @backend {
		proxy_pass http://server:3000;
		proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
	}
}
