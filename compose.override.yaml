# Dev overrides, merged on top of compose.yaml by a plain `docker compose up`.
# Scalars (target, values in environment) replace the base; lists (ports, volumes) are appended.
services:
  postgres:
    ports:
      - '127.0.0.1:5432:5432' # host access for tests, psql, benchmarks

  redis:
    ports:
      - '127.0.0.1:6379:6379'

  server:
    image: url-shortener-server:dev
    build:
      target: dev
    environment:
      PUBLIC_BASE_URL: http://localhost:3000 # dev short links hit Express directly
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./server/src:/app/server/src

  client:
    image: url-shortener-client:dev
    build:
      target: dev
    env_file: client/.env
    environment:
      SERVER_BASE_URL: http://server:3000
    ports: !override # replace, don't append: drop base's 8080:80 (no nginx in dev)
      - '127.0.0.1:5173:5173'
    volumes:
      - ./client/src:/app/client/src
