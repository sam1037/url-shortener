# Base = prod. `docker compose -f compose.yaml up --build` runs this file alone.
# Plain `docker compose up` also merges compose.override.yaml (dev) on top.
services:
  postgres:
    restart: always
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    restart: always
    image: redis:8
    # cap memory; when full, evict the least recently used key (default is noeviction: writes fail)
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru

  server:
    restart: unless-stopped
    image: url-shortener-server:prod
    build:
      context: .
      dockerfile: server/Dockerfile
      target: prod
    env_file: server/.env
    environment: # overrides values from env_file
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: http://localhost:8080

    # no ports: only nginx (client) is reachable from outside
    depends_on:
      - redis
      - postgres

  client:
    restart: unless-stopped
    image: url-shortener-client:prod # separate tag per target, so dev and prod builds don't overwrite each other
    build:
      context: .
      dockerfile: client/Dockerfile
      target: prod
    ports:
      - '127.0.0.1:8080:80'
    depends_on:
      - server

volumes:
  pgdata:
