services:
  postgres:
    restart: always
    image: postgres:18
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - '127.0.0.1:5432:5432' # localhost only, not exposed to the LAN
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  redis:
    restart: always
    image: redis:8
    # cap memory; when full, evict the least recently used key (default is noeviction: writes fail)
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    ports:
      - '127.0.0.1:6379:6379'

  server:
    # restart: ?
    # how to use server/dockerfile:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: dev
    env_file: server/.env
    environment: # overrides values from env_file
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - '127.0.0.1:3000:3000'
    volumes:
      - ./server/src:/app/server/src
    depends_on:
      - redis
      - postgres

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      target: dev
    env_file: client/.env
    environment:
      - SERVER_BASE_URL=http://server:3000
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./client/src:/app/client/src
    depends_on:
      - server

volumes:
  pgdata:
