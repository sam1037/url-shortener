name: CI

# PRs get checked before merge; main gets checked after merge.
# (Plain "push" on every branch would run twice for PR branches.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        # wait until Postgres accepts connections before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # replaces server/.env.test, which is gitignored
    env:
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
      CODE_LENGTH: 6
      DATABASE_URL: postgres://shortener:ci_pw@localhost:5432/shortener_test
      REDIS_URL: redis://localhost:6379/1
      DEFAULT_TTL: 86400
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100000
      SHORTEN_RATE_LIMIT_WINDOW_MS: 60000
      SHORTEN_RATE_LIMIT_MAX: 100000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check -w server
      - run: npm test -w server
      - run: npm run check -w client
      - run: npm run build -w client

  # Merges to main only: build ARM images → push to ECR → pull and restart on EC2.
  deploy:
    needs: check # never deploy untested code
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm # native ARM (free for public repos), matches t4g, no QEMU
    concurrency: deploy # two quick merges deploy one after another, not at once
    permissions:
      id-token: write # lets the job request an OIDC token, exchanged for AWS creds
      contents: read

    steps:
      - uses: actions/checkout@v4

      # TEMP debug: what GitHub's OIDC token actually claims, vs the IAM trust policy. Remove once deploy works.
      - name: Debug OIDC claims
        env:
          ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          TOKEN=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="$PAYLOAD="; done
          echo "$PAYLOAD" | base64 -d | jq '{sub, aud, iss, repository, ref}'
          echo "role name from secret: '${ROLE_ARN##*/}' (secret length ${#ROLE_ARN}, expected 54)"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images (:sha and :latest)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          # compose refuses to parse if an env_file is missing; server/.env is gitignored
          # and only needed at runtime, so an empty one is enough to build
          touch server/.env
          docker compose -f compose.yaml build server client
          docker compose -f compose.yaml push server client
          for svc in server client; do
            docker tag  "$REGISTRY/url-shortener-$svc:$TAG" "$REGISTRY/url-shortener-$svc:latest"
            docker push "$REGISTRY/url-shortener-$svc:latest"
          done

      - name: Deploy to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          SSH="ssh -i $HOME/.ssh/ec2.pem ubuntu@$HOST"
          # keep the server's compose.yaml identical to the repo's
          scp -i ~/.ssh/ec2.pem compose.yaml "ubuntu@$HOST:~/url-shortener/compose.yaml"
          $SSH 'cd ~/url-shortener \
            && docker compose -f compose.yaml pull server client \
            && docker compose -f compose.yaml up -d --no-build \
            && docker image prune -f'
