name: CI

# PRs get checked before merge; main gets checked after merge.
# (Plain "push" on every branch would run twice for PR branches.)
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: shortener_test
        ports:
          - 5432:5432
        # wait until Postgres accepts connections before running steps
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # replaces server/.env.test, which is gitignored
    env:
      PORT: 3000
      PUBLIC_BASE_URL: http://localhost:3000
      CODE_LENGTH: 6
      DATABASE_URL: postgres://shortener:ci_pw@localhost:5432/shortener_test
      REDIS_URL: redis://localhost:6379/1
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 100000
      SHORTEN_RATE_LIMIT_WINDOW_MS: 60000
      SHORTEN_RATE_LIMIT_MAX: 100000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check -w server
      - run: npm test -w server
